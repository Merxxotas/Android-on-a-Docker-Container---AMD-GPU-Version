name: CI/CD & Automated Testing Pipeline

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-validate:
    name: Linting & Syntax Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate shell syntax
        run: |
          bash -n scripts/*.sh tests/*.sh install_android.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck --external-sources scripts/*.sh tests/*.sh

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f compose.yml config
          docker compose -f compose.gpu.yaml config
          docker compose -f compose.yml -f compose.integration.yaml config

      - name: Verify no repository ADB keys
        run: |
          test ! -e keys/adbkey
          test ! -e keys/adbkey.pub
          ! git ls-files | grep -E '(^|/)(adbkey|adbkey\.pub)$'

  build-and-inspect:
    name: Docker Build & Security Inspection
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Android Docker image
        run: |
          docker buildx build \
            --file Dockerfile \
            --tag android-emulator-ci:${{ github.sha }} \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            .

      - name: Inspect image for credentials
        run: |
          docker run --rm --entrypoint /bin/bash "android-emulator-ci:${{ github.sha }}" \
            -c 'test ! -e /root/.android/adbkey && test ! -e /root/.android/adbkey.pub'
          ! docker history --no-trunc "android-emulator-ci:${{ github.sha }}" | grep -E 'COPY keys|adbkey'

      - name: Dump Docker diagnostics on failure
        if: failure()
        run: |
          docker version
          docker system df
