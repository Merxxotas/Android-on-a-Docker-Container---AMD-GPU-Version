name: CI/CD & Automated Testing Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  lint-and-validate:
    name: Linting & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Keys Folder Exists
        run: |
          mkdir -p keys
          touch keys/.gitkeep

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Shell Script Linting (ShellCheck)
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh tests/*.sh

  build-and-test:
    name: Docker Build & Automated Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Host Devices & Keys for CI
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-kvm libvirt-daemon-system cpu-checker android-tools-adb
          sudo chmod 666 /dev/kvm || true
          sudo mkdir -p /dev/dri || true
          export ANDROID_DOCKER_ADB_HOME="$RUNNER_TEMP/android-docker-adb"
          ./scripts/setup-adb-key.sh

      - name: Build Android Docker Image
        run: |
          export ANDROID_DOCKER_ADB_HOME="$RUNNER_TEMP/android-docker-adb"
          docker compose build

      - name: Start Android Emulator Container
        run: |
          export ANDROID_DOCKER_ADB_HOME="$RUNNER_TEMP/android-docker-adb"
          docker compose up -d

      - name: Wait for ADB & Boot Completion
        run: |
          export ANDROID_DOCKER_ADB_HOME="$RUNNER_TEMP/android-docker-adb"
          echo "Waiting for ADB connection..."
          for i in {1..30}; do
            if ./scripts/project-adb.sh connect 127.0.0.1:5555 2>&1 | grep -qE "connected|already"; then
              echo "ADB connected!"
              break
            fi
            sleep 5
          done

      - name: Run Automated Test Suite
        run: |
          export ANDROID_DOCKER_ADB_HOME="$RUNNER_TEMP/android-docker-adb"
          chmod +x tests/run_tests.sh
          ./tests/run_tests.sh

      - name: Container Logs on Failure
        if: failure()
        run: |
          export ANDROID_DOCKER_ADB_HOME="$RUNNER_TEMP/android-docker-adb"
          docker compose logs --tail=100
