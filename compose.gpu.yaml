services:
  android:
    build:
      context: .
      dockerfile: Dockerfile.gpu
      args:
        - API_LEVEL=33
        - CMD_LINE_VERSION=11076708_latest
        - IMG_TYPE=google_apis_playstore
        - GPU_ACCELERATED=true
    container_name: android
    environment:
      - RAM_SIZE=8G
      - DISK_SIZE=64G
      - CPU_CORES=8
      - DISABLE_ANIMATION=false
      - DISABLE_HIDDEN_POLICY=true
      - SKIP_AUTH=false
      - TZ=America/Bogota
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/dri:/dev/dri
    ports:
      - "5554:5554"
      - "127.0.0.1:5555:5555"
    volumes:
      - type: bind
        source: ${ANDROID_DOCKER_ADB_HOME:-${HOME}/.local/share/android-docker/adb-home}/.android/adbkey
        target: /root/.android/adbkey
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ANDROID_DOCKER_ADB_HOME:-${HOME}/.local/share/android-docker/adb-home}/.android/adbkey.pub
        target: /root/.android/adbkey.pub
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    privileged: true
    tty: true
    stdin_open: true
    restart: unless-stopped
